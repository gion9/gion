<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>This Is For You</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  canvas {
    display: block;
  }

  #overlay {
    position: fixed;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd9e8;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    letter-spacing: 0.25em;
    font-weight: 300;
    font-style: italic;
    text-transform: lowercase;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.8),
                 0 0 25px rgba(255, 20, 120, 0.6),
                 0 0 45px rgba(255, 0, 150, 0.4);
    pointer-events: none;
    user-select: none;
    text-align: center;
    z-index: 10;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% {
      opacity: 0.75;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.7),
                   0 0 25px rgba(255, 20, 120, 0.5),
                   0 0 45px rgba(255, 0, 150, 0.3);
    }
    50% {
      opacity: 1;
      text-shadow: 0 0 18px rgba(255, 105, 180, 1),
                   0 0 35px rgba(255, 20, 120, 0.8),
                   0 0 60px rgba(255, 0, 150, 0.6);
    }
  }

  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 182, 213, 0.6);
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 5;
    transition: opacity 1s ease;
  }

  #hint {
    position: fixed;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 200, 220, 0.45);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: sans-serif;
    pointer-events: none;
    user-select: none;
    z-index: 10;
    text-align: center;
    padding: 0 1rem;
  }

  #camStatus {
    position: fixed;
    top: 1rem;
    right: 1rem;
    padding: 0.5rem 1rem;
    background: rgba(255, 45, 117, 0.18);
    border: 1px solid rgba(255, 105, 180, 0.5);
    border-radius: 999px;
    color: #ffd9e8;
    font-family: sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    z-index: 20;
    transition: background 0.3s ease, opacity 0.3s ease;
  }

  #camStatus:hover {
    background: rgba(255, 45, 117, 0.35);
  }

  #webcam {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 160px;
    height: 120px;
    border-radius: 12px;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    pointer-events: none;
    z-index: 15;
    border: 1px solid rgba(255, 105, 180, 0.4);
  }

  #handOverlay {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 160px;
    height: 120px;
    border-radius: 12px;
    transform: scaleX(-1);
    opacity: 0;
    pointer-events: none;
    z-index: 16;
  }

  #webcam.active,
  #handOverlay.active {
    opacity: 1;
  }
</style>
</head>
<body>

  <div id="overlay">this is for you</div>
  <div id="loading">loading love...</div>
  <div id="hint">show your hand to the camera to rotate the heart</div>
  <div id="camStatus">enable camera</div>
  <video id="webcam" playsinline></video>
  <canvas id="handOverlay"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.05);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 18;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    const handState = {
      active: false,
      targetAzimuth: 0,
      targetPolar: Math.PI / 2,
      targetDistance: 9
    };

    const ambientLight = new THREE.AmbientLight(0x442233, 0.6);
    scene.add(ambientLight);

    const pinkLight = new THREE.PointLight(0xff2d75, 4, 30);
    pinkLight.position.set(5, 5, 8);
    scene.add(pinkLight);

    const magentaLight = new THREE.PointLight(0xff00aa, 3, 30);
    magentaLight.position.set(-6, -3, 5);
    scene.add(magentaLight);

    const whiteRim = new THREE.PointLight(0xffffff, 1.2, 25);
    whiteRim.position.set(0, 6, -5);
    scene.add(whiteRim);

    function heartCurvePoint(t, scale) {
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return { x: hx * scale, y: hy * scale };
    }

    function createHeartShape() {
      const shape = new THREE.Shape();

      const scale = 0.115;
      const steps = 40;

      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const point = heartCurvePoint(t, scale);

        if (i === 0) {
          shape.moveTo(point.x, point.y);
        } else {
          shape.lineTo(point.x, point.y);
        }
      }

      return shape;
    }

    const heartShape = createHeartShape();

    const extrudeSettings = {
      depth: 1.1,
      bevelEnabled: true,
      bevelThickness: 0.35,
      bevelSize: 0.3,
      bevelSegments: 1,
      curveSegments: 1
    };

    const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    heartGeometry.center();

    const heartMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff2d6f,
      flatShading: true,
      metalness: 0.15,
      roughness: 0.25,
      clearcoat: 0.6,
      clearcoatRoughness: 0.3,
      transmission: 0.25,
      thickness: 1.2,
      emissive: 0xff0066,
      emissiveIntensity: 0.25,
      ior: 1.4
    });

    const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
    heartMesh.rotation.x = Math.PI * 0.05;
    scene.add(heartMesh);

    const colorPalette = [
      new THREE.Color(0xff4d8d),
      new THREE.Color(0xff1f5e),
      new THREE.Color(0xffffff),
      new THREE.Color(0xff66c4),
      new THREE.Color(0xff0080),
      new THREE.Color(0xffc2dd)
    ];

    const count = 4000;

    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    const particleData = [];

    for (let i = 0; i < count; i++) {
      let x, y, z;
      let isHeart = false;
      let heartParams = null;

      if (Math.random() < 0.7) {
        isHeart = true;

        const t = Math.random() * Math.PI * 2;
        const heartScale = 0.115 * (1.25 + Math.random() * 1.1);
        const depth = (Math.random() - 0.5) * 3.5;

        const point = heartCurvePoint(t, heartScale);
        x = point.x;
        y = point.y;
        z = depth;

        heartParams = { t, heartScale, depth };
      } else {
        const radius = 3.5 + Math.random() * 4.5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        x = radius * Math.sin(phi) * Math.cos(theta);
        y = radius * Math.sin(phi) * Math.sin(theta);
        z = radius * Math.cos(phi);
      }

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;

      sizes[i] = Math.random() * 0.35 + 0.05;

      if (isHeart) {
        particleData.push({
          isHeart: true,
          t: heartParams.t,
          heartScale: heartParams.heartScale,
          depth: heartParams.depth,
          flowSpeed: (Math.random() * 0.3 + 0.15) * (Math.random() < 0.5 ? 1 : -1),
          floatOffset: Math.random() * Math.PI * 2,
          floatSpeed: Math.random() * 0.8 + 0.3
        });
      } else {
        const radiusXZ = Math.sqrt(x * x + z * z);
        particleData.push({
          isHeart: false,
          angle: Math.atan2(z, x),
          radius: radiusXZ,
          speed: (Math.random() * 0.4 + 0.1) * (Math.random() < 0.5 ? 1 : -1),
          baseY: y,
          floatOffset: Math.random() * Math.PI * 2,
          floatSpeed: Math.random() * 0.8 + 0.3
        });
      }
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    function createGlowTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      return new THREE.CanvasTexture(canvas);
    }

    const glowTexture = createGlowTexture();

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.18,
      map: glowTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particleSystem);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      const pulse = 1 + Math.sin(elapsed * 1.6) * 0.06;
      heartMesh.scale.set(pulse, pulse, pulse);

      heartMesh.position.y = Math.sin(elapsed * 0.9) * 0.25;

      heartMesh.rotation.y += 0.0035;

      const posAttr = particleGeometry.attributes.position;
      for (let i = 0; i < count; i++) {
        const data = particleData[i];

        if (data.isHeart) {
          data.t += data.flowSpeed * 0.01;

          const point = heartCurvePoint(data.t, data.heartScale);

          const driftZ = data.depth + Math.sin(elapsed * data.floatSpeed + data.floatOffset) * 0.3;

          posAttr.array[i * 3] = point.x;
          posAttr.array[i * 3 + 1] = point.y;
          posAttr.array[i * 3 + 2] = driftZ;
        } else {
          data.angle += data.speed * 0.01;

          const newX = Math.cos(data.angle) * data.radius;
          const newZ = Math.sin(data.angle) * data.radius;

          const floatY = data.baseY + Math.sin(elapsed * data.floatSpeed + data.floatOffset) * 0.15;

          posAttr.array[i * 3] = newX;
          posAttr.array[i * 3 + 1] = floatY;
          posAttr.array[i * 3 + 2] = newZ;
        }
      }
      posAttr.needsUpdate = true;

      if (handState.active) {
        controls.autoRotate = false;

        const spherical = new THREE.Spherical().setFromVector3(camera.position);

        spherical.theta += (handState.targetAzimuth - spherical.theta) * 0.08;
        spherical.phi += (handState.targetPolar - spherical.phi) * 0.08;
        spherical.radius += (handState.targetDistance - spherical.radius) * 0.08;

        spherical.phi = Math.max(0.25, Math.min(Math.PI - 0.25, spherical.phi));
        spherical.radius = Math.max(controls.minDistance, Math.min(controls.maxDistance, spherical.radius));

        camera.position.setFromSpherical(spherical);
        camera.lookAt(0, 0, 0);
      }

      controls.update();

      pinkLight.intensity = 3.5 + Math.sin(elapsed * 2) * 0.8;
      magentaLight.intensity = 2.5 + Math.cos(elapsed * 1.5) * 0.7;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const videoEl = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('handOverlay');
    const overlayCtx = overlayCanvas.getContext('2d');
    const camStatus = document.getElementById('camStatus');
    const hintEl = document.getElementById('hint');

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];

    function onHandResults(results) {
      overlayCtx.save();
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      const landmarksList = results.multiHandLandmarks;

      if (landmarksList && landmarksList.length > 0) {
        const landmarks = landmarksList[0];

        overlayCtx.strokeStyle = 'rgba(255, 105, 180, 0.9)';
        overlayCtx.lineWidth = 2;
        HAND_CONNECTIONS.forEach(([a, b]) => {
          const pa = landmarks[a];
          const pb = landmarks[b];
          overlayCtx.beginPath();
          overlayCtx.moveTo(pa.x * overlayCanvas.width, pa.y * overlayCanvas.height);
          overlayCtx.lineTo(pb.x * overlayCanvas.width, pb.y * overlayCanvas.height);
          overlayCtx.stroke();
        });

        overlayCtx.fillStyle = '#ff66c4';
        landmarks.forEach((p) => {
          overlayCtx.beginPath();
          overlayCtx.arc(p.x * overlayCanvas.width, p.y * overlayCanvas.height, 3, 0, Math.PI * 2);
          overlayCtx.fill();
        });

        const wrist = landmarks[0];
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];

        const handX = wrist.x;
        const handY = wrist.y;

        handState.targetAzimuth = (handX - 0.5) * Math.PI * 1.6;
        handState.targetPolar = Math.PI / 2 + (handY - 0.5) * Math.PI * 0.9;

        const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        const minDist = 4;
        const maxDist = 18;
        const normalized = Math.min(1, Math.max(0, (pinchDist - 0.03) / 0.25));
        handState.targetDistance = maxDist - normalized * (maxDist - minDist);

        handState.active = true;
        hintEl.textContent = 'move your hand to rotate · pinch to zoom';
      } else {
        handState.active = false;
        hintEl.textContent = 'show your hand to the camera to rotate the heart';
        controls.autoRotate = true;
      }

      overlayCtx.restore();
    }

    let hands = null;
    let mpCamera = null;

    async function startHandTracking() {
      camStatus.textContent = 'starting camera...';

      try {
        hands = new Hands({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        hands.onResults(onHandResults);

        mpCamera = new Camera(videoEl, {
          onFrame: async () => {
            await hands.send({ image: videoEl });
          },
          width: 320,
          height: 240
        });

        await mpCamera.start();

        overlayCanvas.width = 320;
        overlayCanvas.height = 240;

        videoEl.classList.add('active');
        overlayCanvas.classList.add('active');
        camStatus.textContent = 'camera on';
        camStatus.style.cursor = 'default';
      } catch (err) {
        camStatus.textContent = 'camera unavailable';
        hintEl.textContent = 'drag to rotate · scroll to zoom';
      }
    }

    camStatus.addEventListener('click', () => {
      if (!hands) {
        startHandTracking();
      }
    });


    const loadingEl = document.getElementById('loading');
    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.remove(), 1000);

    animate();
  </script>
</body>
</html>
